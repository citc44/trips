name: Deploy Dev

on:
  push:
    branches: [main]

concurrency:
  group: dev-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

      - name: Test
        run: npm test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions (Deno)
        # Run from inside the function's own directory — from the repo root, Deno
        # picks up the app's package.json and tries Node-style node_modules
        # resolution instead of its own npm-specifier cache.
        working-directory: supabase/functions/send-otp-email
        run: deno check --no-config index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project (dev)
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET_DEV }}

      - name: Push database migrations (dev)
        run: supabase db push --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}
          SEND_EMAIL_HOOK_SECRET: ${{ secrets.SEND_EMAIL_HOOK_SECRET_DEV }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger development EAS build
        # Android only for now: iOS internal/ad-hoc distribution requires a one-time
        # interactive credential setup (Apple's own constraint, not scriptable even
        # with an App Store Connect API key) — see Story 1.1 Dev Notes.
        # --no-wait: this step succeeding means the build was queued, not that it
        # passed — check the Expo dashboard for actual build status.
        run: eas build --platform android --profile development --non-interactive --no-wait
