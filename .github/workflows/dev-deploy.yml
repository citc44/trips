name: Deploy Dev

on:
  push:
    branches: [main]

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project (dev)
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_DEV }} --password "${{ secrets.SUPABASE_DB_PASSWORD_DEV }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations (dev)
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD_DEV }}" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger development EAS build
        run: eas build --platform all --profile development --non-interactive --no-wait
