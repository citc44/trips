name: Deploy Prod

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project (prod)
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID_PROD }} --password "${{ secrets.SUPABASE_DB_PASSWORD_PROD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push database migrations (prod)
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD_PROD }}" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger production EAS build
        # Android only for now — see dev-deploy.yml comment / Story 1.1 Dev Notes.
        run: eas build --platform android --profile production --non-interactive --no-wait
