<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voylo — Memory Lane, Direction B: Interactive Swipe</title>
<style>
/*
  Story 6.2 discovery pass -- interactive rebuild of the confirmed
  "Player Constellation" deck after feedback that static side-by-side
  frames didn't convey how exciting the SWIPE ITSELF should feel. This is
  a real drag-driven prototype: cards follow the finger/pointer with tilt
  and depth, a background aurora layer moves at a different speed than the
  foreground (parallax), and each card's content plays a staggered,
  elastic entrance animation every time it becomes active -- not a single
  static fade after the swipe completes.
  Open this file directly and drag left/right (mouse or touch), or use the
  arrow keys / on-screen chevrons.
  palette: Wayfinder -- primary blue #0B6FFF, teal #00C2A8, coral #FF5A5F,
  amber #FFB020, white #FFFFFF, surface-secondary #F4F6FA, ink #101828,
  ink-secondary #667085, hairline #DCE1EA.
  Font stand-ins: display -> "Segoe UI Semibold" (Clash Display); body ->
  "Segoe UI" (General Sans); stat -> "Consolas", monospace (Space Mono).
*/
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: #101828; font-family: "Segoe UI", Arial, sans-serif; }
#viewport { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; }

/* wide parallax background strip -- moves slower than foreground */
#aurora-strip { position: absolute; top: 0; left: 0; height: 100%; width: 700%; will-change: transform; }
.aurora-slot { position: absolute; top: 0; height: 100%; width: 14.2857%; }
.aurora-slot svg { width: 100%; height: 100%; display: block; }

/* foreground deck */
#deck { position: absolute; top: 0; left: 0; height: 100%; width: 700%; display: flex; will-change: transform; }
.card { width: 14.2857%; height: 100%; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

.dots-nav { position: absolute; top: 5%; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; z-index: 20; }
.dot-nav { width: 6px; height: 6px; border-radius: 50%; background: rgba(16,24,40,0.16); transition: all 300ms ease; }
.dot-nav.active { background: #0B6FFF; width: 20px; border-radius: 4px; }

.swipehint { position: absolute; bottom: 4%; left: 0; right: 0; text-align: center; color: rgba(16,24,40,0.38); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; z-index: 20; }
.chevron { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid #DCE1EA; box-shadow: 0 3px 8px rgba(16,24,40,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 50; color: #101828; font-size: 18px; user-select: none; }
.chevron.left { left: 18px; } .chevron.right { right: 18px; }
.chevron:hover { background: #F4F6FA; }

.stat-num { font-family: "Consolas", "Courier New", monospace; font-weight: 700; }
.headline { font-family: "Segoe UI Semibold", "Helvetica Neue", system-ui, sans-serif; font-weight: 700; color: #101828; line-height: 1.15; }
.content-panel { position: relative; z-index: 10; background: #FFFFFF; border: 1px solid #DCE1EA; border-radius: 24px; box-shadow: 0 3px 0 #DCE1EA; padding: 26px; width: min(84%, 320px); }

/* entrance-animated elements: JS toggles .play to (re)start these */
.enter { opacity: 0; }
.enter.play { animation-fill-mode: both; }
.enter.e-up.play { animation: eUp 620ms cubic-bezier(.22,1,.36,1); }
.enter.e-pop.play { animation: ePop 560ms cubic-bezier(.34,1.56,.64,1); }
.enter.e-side.play { animation: eSide 620ms cubic-bezier(.22,1,.36,1); }
@keyframes eUp { 0% { opacity:0; transform: translateY(22px); } 100% { opacity:1; transform: translateY(0); } }
@keyframes ePop { 0% { opacity:0; transform: scale(0.3); } 65% { opacity:1; transform: scale(1.12); } 100% { opacity:1; transform: scale(1); } }
@keyframes eSide { 0% { opacity:0; transform: translateX(var(--fromx,-24px)); } 100% { opacity:1; transform: translateX(0); } }

@keyframes heartGlow { 0%,100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }
@keyframes orbit { from { transform: rotate(0deg) translateX(min(22vw,90px)) rotate(0deg); } to { transform: rotate(360deg) translateX(min(22vw,90px)) rotate(-360deg); } }
@keyframes ringPulse { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.06); opacity: 1; } }
@keyframes burstOut { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }
@keyframes fillBar { from { width: 0; } to { width: var(--w); } }
</style>
</head>
<body>

<div id="viewport">
  <div id="aurora-strip"></div>
  <div id="deck"></div>
</div>
<div class="dots-nav" id="dotsNav"></div>
<div class="swipehint" id="swipehint">← drag to swipe →</div>
<div class="chevron left" id="prevBtn">‹</div>
<div class="chevron right" id="nextBtn">›</div>

<script>
const CARDS = [
  { id:'trigger', dots:false, aurora:[[70,180,180,'#00C2A8',0.22],[260,140,160,'#FF5A5F',0.18],[180,480,200,'#FFB020',0.2],[20,560,150,'#0B6FFF',0.12]],
    render: () => `
      <div style="position:relative; width:min(44vw,180px); height:min(44vw,180px); margin-bottom:6%;">
        <div class="enter e-pop" data-d="0" style="position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:#0B6FFF; box-shadow:0 0 0 8px rgba(11,111,255,0.14);"></div>
        <div style="position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22); background:#00C2A8; animation:orbit 5.5s linear infinite;"></div>
        <div style="position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22); background:#FF5A5F; animation:orbit 7.5s linear infinite reverse;"></div>
        <div style="position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22); background:#FFB020; animation:orbit 9s linear infinite;"></div>
      </div>
      <div class="enter e-up headline" data-d="120" style="font-size:min(6.5vw,27px); text-align:center; padding:0 10%;">Everyone's story<br>is ready.</div>
      <div class="enter e-up" data-d="260" style="margin-top:10px; color:#667085; font-size:14px; text-align:center;">See it the way the whole crew lived it.</div>
      <div class="enter e-pop" data-d="420" style="margin-top:7%; background:#0B6FFF; color:#fff; border-radius:999px; padding:16px 36px; font-size:15px; font-weight:700; box-shadow:0 6px 0 #0653C7;">Show me my Voylo</div>
    `},
  { id:'destination', dots:0, aurora:[[90,220,170,'#00C2A8',0.24],[230,300,150,'#FF5A5F',0.2],[160,420,190,'#FFB020',0.2]],
    render: () => `
      <div style="display:flex; gap:10px; margin-bottom:4%;">
        <div class="enter e-side" data-d="0" style="--fromx:-40px; width:26px; height:26px; border-radius:50%; background:#00C2A8; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22);"></div>
        <div class="enter e-side" data-d="140" style="--fromx:40px; width:22px; height:22px; border-radius:50%; background:#FF5A5F; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22); margin-top:6px;"></div>
        <div class="enter e-side" data-d="280" style="--fromx:-30px; width:18px; height:18px; border-radius:50%; background:#FFB020; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22); margin-top:10px;"></div>
      </div>
      <div class="enter e-up" data-d="380" style="font-size:11px; color:#667085; text-transform:uppercase; letter-spacing:0.08em; font-weight:700;">Destination</div>
      <div class="enter e-up headline" data-d="460" style="font-size:min(9vw,36px); margin-top:2px;">Big Sur</div>
      <div class="enter e-up" data-d="560" style="margin-top:9px; color:#667085; font-size:13.5px; max-width:230px; text-align:center;">Three friends, one coastline, and the road that started it all.</div>
    `},
  { id:'who-joined', dots:1, aurora:[[110,260,170,'#00C2A8',0.22],[210,220,140,'#FFB020',0.22],[160,360,150,'#FF5A5F',0.2]],
    render: () => `
      <div style="position:relative; width:min(60vw,240px); height:min(35vw,140px); margin-bottom:4%;">
        <div class="enter e-pop" data-d="80" style="position:absolute; left:30%; top:10%; width:34px; height:34px; margin-left:-17px; border-radius:50%; background:#00C2A8; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22);"></div>
        <div class="enter e-pop" data-d="340" style="position:absolute; left:74%; top:0%; width:28px; height:28px; margin-left:-14px; border-radius:50%; background:#FFB020; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.22);"></div>
        <div class="enter e-pop" data-d="780" style="position:absolute; left:50%; top:46%; width:30px; height:30px; margin-left:-15px; border-radius:50%; background:#FF5A5F; border:3px solid #fff; box-shadow:0 0 0 12px rgba(255,90,95,0.16);"></div>
      </div>
      <div class="enter e-up content-panel" data-d="900" style="text-align:left;">
        <div class="headline" style="font-size:19px;">Chintan showed up fashionably late — 42 minutes in.</div>
        <div style="margin-top:7px; color:#667085; font-size:13px;">Meera and Sam were already three songs deep.</div>
      </div>
    `},
  { id:'stops', dots:2, aurora:[[70,160,170,'#00C2A8',0.18],[250,500,200,'#FF5A5F',0.16],[150,600,170,'#FFB020',0.18]],
    render: () => `
      <div class="enter e-up content-panel">
        <div style="font-size:11px; color:#667085; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; margin-bottom:14px; text-align:center;">Stops by crew member</div>
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; gap:8px;"><div style="width:10px; height:10px; border-radius:50%; background:#00C2A8; flex-shrink:0;"></div><div style="font-size:13px; font-weight:700; width:56px; text-align:left;">Meera</div><div style="flex:1; height:9px; background:#EDEFF3; border-radius:5px; overflow:hidden;"><div class="enter" data-d="150" style="height:100%; background:#00C2A8; border-radius:5px; --w:80%; width:0;"></div></div><div class="stat-num" style="font-size:13px; width:16px;">3</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><div style="width:10px; height:10px; border-radius:50%; background:#FF5A5F; flex-shrink:0;"></div><div style="font-size:13px; font-weight:700; width:56px; text-align:left;">Chintan</div><div style="flex:1; height:9px; background:#EDEFF3; border-radius:5px; overflow:hidden;"><div class="enter" data-d="320" style="height:100%; background:#FF5A5F; border-radius:5px; --w:55%; width:0;"></div></div><div class="stat-num" style="font-size:13px; width:16px;">2</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><div style="width:10px; height:10px; border-radius:50%; background:#FFB020; flex-shrink:0;"></div><div style="font-size:13px; font-weight:700; width:56px; text-align:left;">Sam</div><div style="flex:1; height:9px; background:#EDEFF3; border-radius:5px; overflow:hidden;"><div class="enter" data-d="490" style="height:100%; background:#FFB020; border-radius:5px; --w:30%; width:0;"></div></div><div class="stat-num" style="font-size:13px; width:16px;">1</div></div>
        </div>
        <div class="enter e-up" data-d="700" style="font-size:12.5px; color:#667085; text-align:center; margin-top:13px;">6 stops. 6 reasons to remember the ride.</div>
      </div>
    `},
  { id:'superlatives', dots:3, aurora:[[200,180,190,'#FFB020',0.22],[80,470,160,'#00C2A8',0.16]],
    render: () => `
      <div class="enter e-up content-panel" style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px;">
        <div>
          <div style="position:relative; width:68px; height:68px; margin:0 auto;">
            <div class="enter e-pop" data-d="500" style="position:absolute; left:50%; top:-24px; transform:translateX(-50%); font-size:18px;">👑</div>
            <div class="enter e-pop" data-d="60" style="width:68px; height:68px; border-radius:50%; background:#FFB020; border:4px solid #fff; box-shadow:0 4px 14px rgba(0,0,0,0.15);"></div>
          </div>
          <div style="font-size:10.5px; color:#667085; text-transform:uppercase; letter-spacing:0.08em; margin-top:10px; font-weight:700;">Coffee Champion</div>
          <div class="headline" style="font-size:19px; margin-top:2px;">Sam</div>
        </div>
        <div style="height:1px; background:#DCE1EA; width:80%;"></div>
        <div>
          <div class="enter e-pop" data-d="600" style="width:52px; height:52px; border-radius:50%; background:#00C2A8; border:4px solid #fff; box-shadow:0 4px 14px rgba(0,0,0,0.15); margin:0 auto;"></div>
          <div style="font-size:10.5px; color:#667085; text-transform:uppercase; letter-spacing:0.08em; margin-top:8px; font-weight:700;">Longest Rest Stop</div>
          <div class="headline" style="font-size:16px; margin-top:2px;">Chintan — 24 min</div>
        </div>
      </div>
    `},
  { id:'finale', dots:4, aurora:[[90,200,180,'#00C2A8',0.2],[230,260,160,'#FF5A5F',0.18],[150,440,200,'#FFB020',0.2]],
    render: () => `
      <div style="position:absolute; top:14%; width:100%; display:flex; justify-content:center; gap:min(6vw,26px);">
        <div class="enter e-pop" data-d="60" style="width:15px; height:15px; border-radius:50%; background:#00C2A8; border:2px solid #fff;"></div>
        <div class="enter e-pop" data-d="220" style="width:13px; height:13px; border-radius:50%; background:#FF5A5F; border:2px solid #fff; margin-top:8px;"></div>
        <div class="enter e-pop" data-d="380" style="width:12px; height:12px; border-radius:50%; background:#FFB020; border:2px solid #fff; margin-top:14px;"></div>
      </div>
      <div class="enter e-up content-panel" data-d="550" style="text-align:center;">
        <div style="display:flex; gap:22px; justify-content:center; margin-bottom:12px;">
          <div><div class="stat-num countup" data-target="402" data-suffix="" data-format="time" style="font-size:26px; color:#0B6FFF;">0</div><div style="font-size:9.5px; color:#98A2B3; text-transform:uppercase; letter-spacing:0.06em;">Duration</div></div>
          <div><div class="stat-num countup" data-target="214" data-suffix="mi" style="font-size:26px; color:#0B6FFF;">0mi</div><div style="font-size:9.5px; color:#98A2B3; text-transform:uppercase; letter-spacing:0.06em;">Distance</div></div>
        </div>
        <div style="font-family:'Segoe UI Semibold',sans-serif; font-size:15px; font-style:italic; color:#101828; line-height:1.4;">"The map said five hours.<br>The memories took twelve."</div>
      </div>
    `},
  { id:'closing', dots:false, aurora:[[150,300,220,'#00C2A8',0.12],[150,300,220,'#FF5A5F',0.08],[150,300,220,'#FFB020',0.08]],
    render: () => `
      <div style="position:absolute; width:min(50vw,190px); height:min(50vw,190px); border-radius:50%; border:2px dashed #DCE1EA; animation:ringPulse 3s ease-in-out infinite;"></div>
      <div class="enter e-pop" data-d="60" style="position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.2); background:#00C2A8; top:28%;"></div>
      <div class="enter e-pop" data-d="220" style="position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.2); background:#FF5A5F; top:58%; left:63%;"></div>
      <div class="enter e-pop" data-d="380" style="position:absolute; width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 3px 8px rgba(16,24,40,0.2); background:#FFB020; top:58%; left:37%;"></div>
      <div style="position:absolute; width:7px; height:7px; border-radius:50%; background:#FFB020; animation:burstOut 900ms ease-out infinite;"></div>
      <div style="position:absolute; width:7px; height:7px; border-radius:50%; background:#FFB020; animation:burstOut 900ms 0.3s ease-out infinite;"></div>
      <div style="position:relative; z-index:10; text-align:center; margin-top:34%;">
        <div class="enter e-up headline" data-d="550" style="font-size:22px;">Until the next one, crew.</div>
        <div class="enter e-up" data-d="680" style="margin-top:8px; color:#667085; font-size:13.5px; max-width:230px;">Your Voylo is saved — come back anytime, or send it to them.</div>
        <div class="enter e-pop" data-d="850" style="margin-top:24px; display:inline-block; background:#0B6FFF; color:#fff; border-radius:999px; padding:14px 34px; font-size:14px; font-weight:700; box-shadow:0 6px 0 #0653C7;">Close</div>
      </div>
    `},
];

const deck = document.getElementById('deck');
const auroraStrip = document.getElementById('aurora-strip');
const dotsNav = document.getElementById('dotsNav');
const swipehint = document.getElementById('swipehint');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

CARDS.forEach((c, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.index = i;
  card.innerHTML = c.render();
  deck.appendChild(card);

  const slot = document.createElement('div');
  slot.className = 'aurora-slot';
  const blobs = c.aurora.map(([cx,cy,r,color,op]) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity="${op}"/>`).join('');
  slot.innerHTML = `<svg viewBox="0 0 300 649" preserveAspectRatio="xMidYMid slice"><rect width="300" height="649" fill="#F4F6FA"/>${blobs}</svg>`;
  auroraStrip.appendChild(slot);
});

const dotCards = CARDS.filter(c => c.dots !== false);
dotCards.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'dot-nav';
  d.dataset.dotIndex = c.dots;
  dotsNav.appendChild(d);
});

let index = 0;
let dragging = false;
let startX = 0;
let currentDelta = 0;
let vw = window.innerWidth;
window.addEventListener('resize', () => { vw = window.innerWidth; setTransform(false); });

function setTransform(animate) {
  deck.style.transition = animate ? 'transform 480ms cubic-bezier(.22,1,.36,1)' : 'none';
  auroraStrip.style.transition = animate ? 'transform 480ms cubic-bezier(.22,1,.36,1)' : 'none';
  const base = -index * vw + currentDelta;
  deck.style.transform = `translateX(${base}px)`;
  auroraStrip.style.transform = `translateX(${base * 0.55}px)`;
}

function playEntrance(cardEl) {
  const els = cardEl.querySelectorAll('.enter');
  els.forEach(el => {
    el.classList.remove('play');
    void el.offsetWidth;
    const delay = parseInt(el.dataset.d || '0', 10);
    el.style.animationDelay = delay + 'ms';
    if (!el.classList.contains('e-up') && !el.classList.contains('e-pop') && !el.classList.contains('e-side')) {
      // progress-bar style element (width fill)
      el.style.width = '0';
      setTimeout(() => { el.style.transition = 'width 700ms cubic-bezier(.22,1,.36,1)'; el.style.width = el.style.getPropertyValue('--w'); }, delay);
    } else {
      requestAnimationFrame(() => el.classList.add('play'));
    }
  });
  const counters = cardEl.querySelectorAll('.countup');
  counters.forEach(el => {
    const target = parseInt(el.dataset.target, 10);
    const fmt = el.dataset.format;
    const suffix = el.dataset.suffix || '';
    const dur = 900;
    const t0 = performance.now();
    function tick(t) {
      const p = Math.min(1, (t - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(target * eased);
      if (fmt === 'time') {
        const h = Math.floor(val / 60), m = val % 60;
        el.textContent = `${h}h ${m}m`;
      } else {
        el.textContent = val + suffix;
      }
      if (p < 1) requestAnimationFrame(tick);
    }
    setTimeout(() => requestAnimationFrame(tick), 500);
  });
}

function updateChrome() {
  const active = CARDS[index];
  dotsNav.style.display = active.dots === false ? 'none' : 'flex';
  if (active.dots !== false) {
    [...dotsNav.children].forEach((d, i) => d.classList.toggle('active', parseInt(d.dataset.dotIndex,10) === active.dots));
  }
  swipehint.style.opacity = (index === 0) ? '1' : '0';
  prevBtn.style.opacity = index === 0 ? '0.25' : '1';
  nextBtn.style.opacity = index === CARDS.length - 1 ? '0.25' : '1';
}

function goTo(newIndex) {
  index = Math.max(0, Math.min(CARDS.length - 1, newIndex));
  currentDelta = 0;
  setTransform(true);
  updateChrome();
  const cardEl = deck.children[index];
  setTimeout(() => playEntrance(cardEl), 120);
}

// pointer drag
let pointerActive = false;
deck.parentElement.addEventListener('pointerdown', (e) => {
  pointerActive = true; dragging = false; startX = e.clientX;
  deck.setPointerCapture && deck.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', (e) => {
  if (!pointerActive) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 6) dragging = true;
  if (!dragging) return;
  let d = dx;
  if ((index === 0 && d > 0) || (index === CARDS.length - 1 && d < 0)) d *= 0.35;
  currentDelta = d;
  setTransform(false);
});
window.addEventListener('pointerup', (e) => {
  if (!pointerActive) return;
  pointerActive = false;
  if (!dragging) return;
  const dx = e.clientX - startX;
  const threshold = vw * 0.16;
  if (dx < -threshold) goTo(index + 1);
  else if (dx > threshold) goTo(index - 1);
  else { currentDelta = 0; setTransform(true); }
});

prevBtn.addEventListener('click', () => goTo(index - 1));
nextBtn.addEventListener('click', () => goTo(index + 1));
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(index + 1);
  if (e.key === 'ArrowLeft') goTo(index - 1);
});
